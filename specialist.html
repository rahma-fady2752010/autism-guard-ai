<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مختص</title>
<style>
body{font-family:system-ui;background:#fef3c7;padding:20px}
.box{background:white;max-width:500px;margin:40px auto;padding:30px;border-radius:20px;box-shadow:0 4px 20px #0001}
label{font-weight:bold;margin-top:15px;display:block}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin-top:5px;box-sizing:border-box}
.btn{width:100%;padding:12px;background:#f59e0b;color:white;border:none;border-radius:10px;margin-top:15px;cursor:pointer;font-size:16px}
.btn-gray{background:#6b7280}
</style>
</head>
<body>
<div class="box">
<h2 style="text-align:center">👩‍⚕️ صفحة المختص</h2>
<label>الاسم</label>
<input type="text" placeholder="اسم المختص">
<label>التخصص</label>
<input type="text" placeholder="مثال: اخصائي تخاطب">
<label>رقم الترخيص</label>
<input type="text" placeholder="رقم الترخيص">
<button class="btn">دخول لوحة التحكم</button>
<a href="index.html"><button class="btn btn-gray">رجوع للرئيسية</button></a>
</div>
</body>
</html>
